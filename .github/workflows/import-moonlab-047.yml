name: Import MoonLab 0.4.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-moonlab-047.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-62e4-81fd-9b15-490677808d7e/raw?se=2026-09-14T17%3A57%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=ac51bcb9-c98c-50a3-87aa-d17c562a718e&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T23%3A14%3A06Z&ske=2026-09-14T23%3A14%3A06Z&sks=b&skv=2026-02-06&sig=82or1WS5I397j50NL/EbK5X/ZaiQoDO3t5zPnDmqH1A%3D"
      EXPECTED_SHA256: "7657bbc07936967cc3be0c8b3b9672a084537d418c227cdb3d6be94af45e89b0"
    steps:
      - uses: actions/checkout@v4

      - name: Download validated 0.4.7 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/moonlab-047.zip
          rm -rf /tmp/moonlab-047
          mkdir -p /tmp/moonlab-047
          unzip -q /tmp/moonlab-047.zip -d /tmp/moonlab-047
          test -f /tmp/moonlab-047/desktop/MoonLab-Setup-0.4.7.exe
          actual=$(sha256sum /tmp/moonlab-047/desktop/MoonLab-Setup-0.4.7.exe | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"

      - name: Publish immutable package and stable manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p moon-lab/releases/0.4.7
          cp /tmp/moonlab-047/desktop/MoonLab-Setup-0.4.7.exe moon-lab/releases/0.4.7/MoonLab-Setup-0.4.7.exe
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.7",
            "status": "stable",
            "notes": "修复连续实验停止：停止在当前题结束后立即生效，不再等待整批；新增“作废本题→垃圾桶”，作废题不进入正常历史/反馈/优化证据；运行中仍锁定模型，停止后可切换。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.7/MoonLab-Setup-0.4.7.exe",
                "sha256": "7657bbc07936967cc3be0c8b3b9672a084537d418c227cdb3d6be94af45e89b0"
              }
            }
          }
          Path('moon-lab/latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit stable 0.4.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moon-lab/releases/0.4.7/MoonLab-Setup-0.4.7.exe moon-lab/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MoonLab 0.4.7 stable'
          git push origin HEAD:main
