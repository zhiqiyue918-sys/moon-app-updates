name: Import MoonLab 0.4.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-moonlab-046.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-58b4-81fd-94f9-5cb222e5c802/raw?se=2026-09-14T17%3A25%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=c6a5b7dc-14f8-5ac3-976e-4455b88156ed&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T16%3A59%3A22Z&ske=2026-09-15T16%3A59%3A22Z&sks=b&skv=2026-02-06&sig=4MJtCqcOtl38e5xfWYfAVutdN4vjOwSsM4/wji9yEP4%3D"
      EXPECTED_SHA256: "4fcb64591ab0c8796999b9bdd51cfa69cf8c4dd8e69385f8b89e5bd11f947898"
    steps:
      - uses: actions/checkout@v4

      - name: Download validated 0.4.6 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/moonlab-046.zip
          rm -rf /tmp/moonlab-046
          mkdir -p /tmp/moonlab-046
          unzip -q /tmp/moonlab-046.zip -d /tmp/moonlab-046
          test -f /tmp/moonlab-046/desktop/MoonLab-Setup-0.4.6.exe
          actual=$(sha256sum /tmp/moonlab-046/desktop/MoonLab-Setup-0.4.6.exe | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"

      - name: Publish immutable package and stable manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p moon-lab/releases/0.4.6
          cp /tmp/moonlab-046/desktop/MoonLab-Setup-0.4.6.exe moon-lab/releases/0.4.6/MoonLab-Setup-0.4.6.exe
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.6",
            "status": "stable",
            "notes": "接入400题正式题库并支持本地Ollama夜间连续跑题；解题端不接收难度/领域等开发标签；本地Reader+Judge默认不触发云端Optimizer；改进Windows覆盖安装。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.6/MoonLab-Setup-0.4.6.exe",
                "sha256": "4fcb64591ab0c8796999b9bdd51cfa69cf8c4dd8e69385f8b89e5bd11f947898"
              }
            }
          }
          Path('moon-lab/latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit stable 0.4.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moon-lab/releases/0.4.6/MoonLab-Setup-0.4.6.exe moon-lab/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MoonLab 0.4.6 stable'
          git push origin HEAD:main
