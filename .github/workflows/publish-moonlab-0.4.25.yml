name: Publish MoonLab 0.4.25 stable

on:
  push:
    paths:
      - '.github/workflows/publish-moonlab-0.4.25.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated private artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-a584-81fd-ad46-a799014b4e5f/raw?se=2026-09-21T16%3A48%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=04e68c03-595c-5e5b-acd3-94295d065966&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A28%3A12Z&ske=2026-09-21T18%3A28%3A12Z&sks=b&skv=2026-02-06&sig=c%2BJyuO6QwO6H%2BhXjXZe/h5yMgtUn/gbnBDb8Q46VSVg%3D' -o /tmp/moonlab.zip
          unzip -q /tmp/moonlab.zip -d /tmp/moonlab
          test -f /tmp/moonlab/desktop/MoonLab-Setup-0.4.25.exe
          echo '9bc6e16a352144fc675cd641da4cef9e7a76c31419cd5e76811e9f09cc46f6d0  /tmp/moonlab/desktop/MoonLab-Setup-0.4.25.exe' | sha256sum -c -
      - name: Publish installer and stable manifest
        run: |
          mkdir -p moon-lab/releases/0.4.25
          cp /tmp/moonlab/desktop/MoonLab-Setup-0.4.25.exe moon-lab/releases/0.4.25/MoonLab-Setup-0.4.25.exe
          cat > moon-lab/latest.json <<'JSON'
          {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.25",
            "status": "stable",
            "notes": "修复对比台 ChatGPT 同步：自动重试瞬时 GitHub 写入冲突，并直接显示 LOCAL_ONLY 的具体原因和脱敏错误。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.25/MoonLab-Setup-0.4.25.exe",
                "sha256": "9bc6e16a352144fc675cd641da4cef9e7a76c31419cd5e76811e9f09cc46f6d0"
              }
            }
          }
          JSON
          git config user.name "MoonLab Release"
          git config user.email "moonlab-release@users.noreply.github.com"
          git add moon-lab/releases/0.4.25/MoonLab-Setup-0.4.25.exe moon-lab/latest.json
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git commit -m "Publish MoonLab 0.4.25 stable"
          git push
