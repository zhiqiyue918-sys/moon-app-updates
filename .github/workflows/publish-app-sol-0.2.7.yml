name: Publish App Sol 0.2.7

on:
  push:
    paths:
      - '.github/workflows/publish-app-sol-0.2.7.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Download validated App Sol build artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b770-81fd-a9fa-220808bf1bde/raw?se=2026-09-13T18%3A34%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=a3b655c7-27c1-5f54-8246-9eee6a648882&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T14%3A12%3A34Z&ske=2026-09-14T14%3A12%3A34Z&sks=b&skv=2026-02-06&sig=s3TfXPmvQyAfz1oraxkhAOnq1vD/YE/tiQ0AnJlBy9c%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force
          $installer = Get-ChildItem artifact -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found in build artifact.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'd54ed5d32ee3b4b470e2aa5542e771a10142d9079890027a561bc22a72976d2c') { throw "Installer hash mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path 'app-sol/releases/0.2.7' | Out-Null
          Copy-Item $installer.FullName 'app-sol/releases/0.2.7/AppSol_0.2.7_x64-setup.exe' -Force

      - name: Publish stable manifest
        shell: pwsh
        run: |
          $manifest = @'
          {
            "schemaVersion": 1,
            "app": "app-sol",
            "channel": "stable",
            "version": "0.2.7",
            "status": "stable",
            "notes": "新增“我的开发”独立栏目，把自己做的软件和开发工具分开；支持自动识别已知自制项目与右键手动归类。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/app-sol/releases/0.2.7/AppSol_0.2.7_x64-setup.exe",
                "sha256": "d54ed5d32ee3b4b470e2aa5542e771a10142d9079890027a561bc22a72976d2c"
              }
            }
          }
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'app-sol/latest.json'), $manifest, (New-Object System.Text.UTF8Encoding($false)))

      - name: Commit update package and feed
        shell: pwsh
        run: |
          git config user.name 'moon-app-updates-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-sol/releases/0.2.7/AppSol_0.2.7_x64-setup.exe app-sol/latest.json
          git commit -m 'release: App Sol 0.2.7' || echo 'Nothing to commit'
          git push
