name: Publish App Sol 0.2.8

on:
  push:
    paths:
      - '.github/workflows/publish-app-sol-0.2.8.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Download validated App Sol build artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-7594-81fd-ae5b-b383ac759cf3/raw?se=2026-09-13T18%3A56%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=bb409be8-44cd-561e-9dc2-e086eb23a96e&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T04%3A01%3A28Z&ske=2026-09-14T04%3A01%3A28Z&sks=b&skv=2026-02-06&sig=6bMkLp1nSJZnKn51nhTMHmAy7yl6UEztA8Ov0Q6jTQo%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force
          $installer = Get-ChildItem artifact -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found in build artifact.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '83d07aaea4f7a90976766bfe1d10988d16bb9aa6ec850dddc7dc83d15443cbc9') { throw "Installer hash mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path 'app-sol/releases/0.2.8' | Out-Null
          Copy-Item $installer.FullName 'app-sol/releases/0.2.8/AppSol_0.2.8_x64-setup.exe' -Force

      - name: Publish stable manifest
        shell: pwsh
        run: |
          $manifest = @'
          {
            "schemaVersion": 1,
            "app": "app-sol",
            "channel": "stable",
            "version": "0.2.8",
            "status": "stable",
            "notes": "修复桌面快捷方式图标：每次安装或更新都会重建快捷方式、显式绑定 App Sol 程序图标，并通知 Windows Explorer 刷新图标缓存。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/app-sol/releases/0.2.8/AppSol_0.2.8_x64-setup.exe",
                "sha256": "83d07aaea4f7a90976766bfe1d10988d16bb9aa6ec850dddc7dc83d15443cbc9"
              }
            }
          }
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'app-sol/latest.json'), $manifest, (New-Object System.Text.UTF8Encoding($false)))

      - name: Commit update package and feed
        shell: pwsh
        run: |
          git config user.name 'moon-app-updates-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-sol/releases/0.2.8/AppSol_0.2.8_x64-setup.exe app-sol/latest.json
          git commit -m 'release: App Sol 0.2.8' || echo 'Nothing to commit'
          git push
