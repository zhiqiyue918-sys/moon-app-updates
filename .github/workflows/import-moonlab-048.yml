name: Import MoonLab 0.4.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-moonlab-048.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-baf0-81fd-be03-9c78b94fdc52/raw?se=2026-09-14T18%3A26%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=6fc402d9-f736-5161-b4b3-4d8aec10668e&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T00%3A34%3A51Z&ske=2026-09-15T00%3A34%3A51Z&sks=b&skv=2026-02-06&sig=aP/CTSaPZjH3OiOETmA2fSmz78O9vZw66zOF47owQ64%3D"
      EXPECTED_SHA256: "f3e9716979cd6c263332cfb9a8eb857b162a8b7dfce30292ccf829ecf53ddee9"
    steps:
      - uses: actions/checkout@v4

      - name: Download validated 0.4.8 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/moonlab-048.zip
          rm -rf /tmp/moonlab-048
          mkdir -p /tmp/moonlab-048
          unzip -q /tmp/moonlab-048.zip -d /tmp/moonlab-048
          test -f /tmp/moonlab-048/desktop/MoonLab-Setup-0.4.8.exe
          actual=$(sha256sum /tmp/moonlab-048/desktop/MoonLab-Setup-0.4.8.exe | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"

      - name: Publish immutable package and stable manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p moon-lab/releases/0.4.8
          cp /tmp/moonlab-048/desktop/MoonLab-Setup-0.4.8.exe moon-lab/releases/0.4.8/MoonLab-Setup-0.4.8.exe
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.8",
            "status": "stable",
            "notes": "历史页补齐垃圾桶：正常历史可直接作废，垃圾桶可查看完整运行快照并恢复；作废题继续与正常历史、反馈经验和Optimizer证据隔离。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.8/MoonLab-Setup-0.4.8.exe",
                "sha256": "f3e9716979cd6c263332cfb9a8eb857b162a8b7dfce30292ccf829ecf53ddee9"
              }
            }
          }
          Path('moon-lab/latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit stable 0.4.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moon-lab/releases/0.4.8/MoonLab-Setup-0.4.8.exe moon-lab/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MoonLab 0.4.8 stable'
          git push origin HEAD:main
