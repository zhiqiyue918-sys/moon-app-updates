name: Publish App Sol 0.2.9

on:
  push:
    paths:
      - '.github/workflows/publish-app-sol-0.2.9.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Download validated App Sol build artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-f1cc-81fd-a305-7dc545d50d34/raw?se=2026-09-14T10%3A49%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=05bcb74f-d9d5-5ff0-a39c-9725c2434d56&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T01%3A38%3A56Z&ske=2026-09-15T01%3A38%3A56Z&sks=b&skv=2026-02-06&sig=l3hNJyHCmx3u3DBq6Hbcjid2ZLzs8Rple/ZbzGVirkQ%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -DestinationPath artifact -Force
          $installer = Get-ChildItem artifact -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found in build artifact.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '92f7db98b8a4202328d50e6cb30dd7f2062be370cc6e7d3a66234775022a060b') { throw "Installer hash mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path 'app-sol/releases/0.2.9' | Out-Null
          Copy-Item $installer.FullName 'app-sol/releases/0.2.9/AppSol_0.2.9_x64-setup.exe' -Force

      - name: Publish stable manifest
        shell: pwsh
        run: |
          $manifest = @'
          {
            "schemaVersion": 1,
            "app": "app-sol",
            "channel": "stable",
            "version": "0.2.9",
            "status": "stable",
            "notes": "启动改为优先读取本地软件库缓存：已有缓存时立即显示，不再每次进入都阻塞式全量扫描；缓存超过10分钟后只在后台刷新，手动“重新扫描”仍会强制全量读取。软件图标也会随缓存复用。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/app-sol/releases/0.2.9/AppSol_0.2.9_x64-setup.exe",
                "sha256": "92f7db98b8a4202328d50e6cb30dd7f2062be370cc6e7d3a66234775022a060b"
              }
            }
          }
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'app-sol/latest.json'), $manifest, (New-Object System.Text.UTF8Encoding($false)))

      - name: Commit update package and feed
        shell: pwsh
        run: |
          git config user.name 'moon-app-updates-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-sol/releases/0.2.9/AppSol_0.2.9_x64-setup.exe app-sol/latest.json
          git commit -m 'release: App Sol 0.2.9' || echo 'Nothing to commit'
          git push
