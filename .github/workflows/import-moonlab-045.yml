name: Import MoonLab 0.4.5 release

on:
  push:
    paths:
      - '.github/workflows/import-moonlab-045.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated MoonLab 0.4.5 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactUrl = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-25c4-81fd-a5fb-2343ccc1c1ca/raw?se=2026-09-14T11%3A08%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=b63826bb-a213-5cef-a664-db8de8caac9b&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T14%3A11%3A40Z&ske=2026-09-14T14%3A11%3A40Z&sks=b&skv=2026-02-06&sig=l6eBiFH0rlzzcPEfGiMxtflzyUx80Y/LNnub5s6t1sw%3D'
          $zip = Join-Path $env:RUNNER_TEMP 'MoonLab-Desktop-0.4.5.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'MoonLab-Desktop-0.4.5'
          Invoke-WebRequest -Uri $artifactUrl -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $installer = Get-ChildItem $expanded -Recurse -Filter 'MoonLab-Setup-0.4.5.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'MoonLab-Setup-0.4.5.exe missing from validated artifact' }
          $expected = '7967f5cb50a155c18e4acd6dfeab4716e0c63dccadfbf6d726ba9d2cb2339f0e'
          $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "MoonLab 0.4.5 SHA256 mismatch: $actual" }
          New-Item -ItemType Directory -Force 'moon-lab/releases/0.4.5' | Out-Null
          Copy-Item $installer.FullName 'moon-lab/releases/0.4.5/MoonLab-Setup-0.4.5.exe' -Force

      - name: Publish stable MoonLab manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '7967f5cb50a155c18e4acd6dfeab4716e0c63dccadfbf6d726ba9d2cb2339f0e'
          $manifest = [ordered]@{
            schemaVersion = 1
            app = 'moon-lab'
            channel = 'stable'
            version = '0.4.5'
            status = 'stable'
            notes = '修复桌面自动更新：不再依赖私有仓库 Git/认证；安装前安全停止 MoonLab 后台服务，后续版本可后台下载并在正常关闭一次后自动安装重开。'
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                url = 'https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.5/MoonLab-Setup-0.4.5.exe'
                sha256 = $expected
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content 'moon-lab/latest.json' -Encoding UTF8
          $check = Get-Content 'moon-lab/latest.json' -Raw | ConvertFrom-Json
          if ($check.version -ne '0.4.5' -or $check.platforms.'windows-x86_64'.sha256 -ne $expected) {
            throw 'MoonLab public manifest verification failed'
          }

      - name: Commit public MoonLab 0.4.5 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'moon-lab/releases/0.4.5/MoonLab-Setup-0.4.5.exe' 'moon-lab/latest.json'
          git commit -m 'Publish MoonLab 0.4.5'
          git pull --rebase origin main
          git push origin HEAD:main
