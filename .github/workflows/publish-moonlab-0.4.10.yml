name: Publish MoonLab 0.4.10 stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-moonlab-0.4.10.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated MoonLab desktop artifact
        env:
          SOURCE_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9ba0-8211-92b8-5e8efcce6fe0/raw?se=2026-09-15T15%3A36%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=5457082e-d858-5dbf-bf69-cf6257309c2a&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A27%3A40Z&ske=2026-09-15T20%3A27%3A40Z&sks=b&skv=2026-02-06&sig=rLoGDpCVDUUzyqW0X94BVBspOM4%2BZD5k6OctRzgzUZg%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/moonlab-0410.zip
          rm -rf /tmp/moonlab-0410 && mkdir -p /tmp/moonlab-0410
          unzip -q /tmp/moonlab-0410.zip -d /tmp/moonlab-0410
          test -f /tmp/moonlab-0410/desktop/MoonLab-Setup-0.4.10.exe
          echo 'c10591544a7c3cb7ca37723781306688254127043dc31e29dd620f17fc29c34e  /tmp/moonlab-0410/desktop/MoonLab-Setup-0.4.10.exe' | sha256sum -c -
      - name: Publish immutable installer and latest manifest
        run: |
          set -euo pipefail
          mkdir -p moon-lab/releases/0.4.10
          cp /tmp/moonlab-0410/desktop/MoonLab-Setup-0.4.10.exe moon-lab/releases/0.4.10/MoonLab-Setup-0.4.10.exe
          cat > moon-lab/latest.json <<'JSON'
          {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.10",
            "status": "stable",
            "notes": "修复审阅台‘跑 1 题’错误固定使用 Golden 第一题和固定牌阵的问题；现在单题从正式题库随机抽题，三张牌与正逆位使用独立随机源重新抽取，Golden 仅保留给回归测试。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.10/MoonLab-Setup-0.4.10.exe",
                "sha256": "c10591544a7c3cb7ca37723781306688254127043dc31e29dd620f17fc29c34e"
              }
            }
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moon-lab/releases/0.4.10/MoonLab-Setup-0.4.10.exe moon-lab/latest.json
          git commit -m 'moon-lab: publish 0.4.10 stable'
          git push origin main
