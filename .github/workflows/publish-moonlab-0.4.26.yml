name: Publish MoonLab 0.4.26 stable

on:
  push:
    paths:
      - '.github/workflows/publish-moonlab-0.4.26.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated private artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-2cc0-81fd-9874-707ef9e3d015/raw?se=2026-09-21T17%3A25%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=cc902f7a-262c-52e3-9099-b1a22ca05cd8&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T12%3A31%3A47Z&ske=2026-09-22T12%3A31%3A47Z&sks=b&skv=2026-02-06&sig=eNZLtSQrUTmln2ErzVYOC7KHJKUhR1lWjbyuriKzR6s%3D' -o /tmp/moonlab.zip
          unzip -q /tmp/moonlab.zip -d /tmp/moonlab
          test -f /tmp/moonlab/desktop/MoonLab-Setup-0.4.26.exe
          echo '01b38ac799721cb4df37d3228cd044050ddc76f177c93ebbe5f498a702a3caf0  /tmp/moonlab/desktop/MoonLab-Setup-0.4.26.exe' | sha256sum -c -
      - name: Publish installer and stable manifest
        run: |
          mkdir -p moon-lab/releases/0.4.26
          cp /tmp/moonlab/desktop/MoonLab-Setup-0.4.26.exe moon-lab/releases/0.4.26/MoonLab-Setup-0.4.26.exe
          cat > moon-lab/latest.json <<'JSON'
          {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.26",
            "status": "stable",
            "notes": "修复对比台同步 fallback：Git fallback 现在真正带 GitHub Token；新增 Token/仓库/runtime-exchange 分支可见性探针。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.26/MoonLab-Setup-0.4.26.exe",
                "sha256": "01b38ac799721cb4df37d3228cd044050ddc76f177c93ebbe5f498a702a3caf0"
              }
            }
          }
          JSON
          git config user.name "MoonLab Release"
          git config user.email "moonlab-release@users.noreply.github.com"
          git add moon-lab/releases/0.4.26/MoonLab-Setup-0.4.26.exe moon-lab/latest.json
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git commit -m "Publish MoonLab 0.4.26 stable"
          git push
