name: Publish MoonLab 0.4.14 stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-moonlab-0.4.14.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated MoonLab desktop artifact
        env:
          SOURCE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-4248-8230-a3bc-0abff8ee8479/raw?se=2026-09-21T07%3A05%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=e74e80d7-d303-570f-92ea-16ee08766ece&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A25%3A53Z&ske=2026-09-21T18%3A25%3A53Z&sks=b&skv=2026-02-06&sig=egQLT5nS55FkHX%2BiJaCDqign%2Bqm7%2B8MkMqILBGiUyXo%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/moonlab-0414.zip
          rm -rf /tmp/moonlab-0414 && mkdir -p /tmp/moonlab-0414
          unzip -q /tmp/moonlab-0414.zip -d /tmp/moonlab-0414
          test -f /tmp/moonlab-0414/desktop/MoonLab-Setup-0.4.14.exe
          echo '51e3ea9662c014ddddc1431f2850d10a857dd185b3de621f648bfcc244b438c5  /tmp/moonlab-0414/desktop/MoonLab-Setup-0.4.14.exe' | sha256sum -c -
      - name: Publish immutable installer and latest manifest
        run: |
          set -euo pipefail
          mkdir -p moon-lab/releases/0.4.14
          cp /tmp/moonlab-0414/desktop/MoonLab-Setup-0.4.14.exe moon-lab/releases/0.4.14/MoonLab-Setup-0.4.14.exe
          cat > moon-lab/latest.json <<'JSON'
          {
            "schemaVersion": 1,
            "app": "moon-lab",
            "channel": "stable",
            "version": "0.4.14",
            "status": "stable",
            "notes": "新增私有历史直读交换层：跑题后可直接读取题目、牌面、Moon回答、Judge与Token/cache用量；不同步API Key、完整Prompt/Skill原文。",
            "platforms": {
              "windows-x86_64": {
                "url": "https://raw.githubusercontent.com/zhiqiyue918-sys/moon-app-updates/main/moon-lab/releases/0.4.14/MoonLab-Setup-0.4.14.exe",
                "sha256": "51e3ea9662c014ddddc1431f2850d10a857dd185b3de621f648bfcc244b438c5"
              }
            }
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moon-lab/releases/0.4.14/MoonLab-Setup-0.4.14.exe moon-lab/latest.json
          git commit -m 'moon-lab: publish 0.4.14 stable'
          git push origin main
